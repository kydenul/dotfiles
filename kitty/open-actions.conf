# open-actions.conf — kitty 0.49+ 链接点击行为
#
# 配合 kitty.conf 中的 detect_url_regex：编译器输出里的 "path/file.ext:line[:col]"
# 会被识别为链接；点击（tmux 内需 ctrl+shift+click，普通 click 会被 tmux 吃掉）
# 即在新 tmux window 中用 nvim 打开并定位到对应行列。
# url 条件使用 Python 正则，需与 kitty.conf 的 detect_url_regex 保持同步。
# 实际处理逻辑在 ~/.dotfiles/script/open-file-ref。

url ^[\w./~-]+\.\w+:\d+(?::\d+)?$
action launch --type=background --cwd=current open-file-ref ${URL}
